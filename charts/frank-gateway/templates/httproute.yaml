{{- if .Values.httpRoute.enabled }}
{{- $backendRefs := include "frank-gateway.routeBackendRefs" (dict "root" . "port" .Values.httpRoute.defaultBackendPort) | fromYamlArray }}
{{- $rules := list }}
{{- range (include "frank-gateway.tplvalues.render" (dict "value" .Values.httpRoute.rules "context" $) | fromYamlArray) }}
{{- $rule := deepCopy . }}
{{- if not $rule.backendRefs }}
{{- $_ := set $rule "backendRefs" (deepCopy $backendRefs) }}
{{- end }}
{{- $rules = append $rules $rule }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "frank-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frank-gateway.labels" . | nindent 4 }}
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (include "frank-gateway.annotations" (dict "annotations" .Values.httpRoute.annotations "context" $)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- include "frank-gateway.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- include "frank-gateway.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  rules:
    {{- toYaml $rules | nindent 4 }}
{{- end }}
