## @section General
## @descriptionStart
## Frank!Gateway: Apache APISIX in standalone (file-driven) mode with the WeAreFrank plugins.
## There is no etcd and no Admin API. Routes are read from an `apisix.yaml` file, see `standalone`.
##
## Naming follows the Kubernetes manifests where possible: `env`, `volumes`, `ingress.rules`,
## `httpRoute.parentRefs`, `service.ports` and so on have the same structure as the Kubernetes field.
##
## Values marked as template can contain Helm templates, for example `{{ .Release.Name }}`
## or `{{ .Release.Namespace }}`. This is not the case for `standalone.apisixYaml` and `config`: their
## `${{NAME}}` placeholders are for APISIX, which resolves them from the environment.
## @descriptionEnd

## @param nameOverride Partially override the chart name used in resource names
nameOverride: ""
## @param fullnameOverride Fully override the resource name prefix
fullnameOverride: ""
## @param commonLabels Labels added to all resources (template). The standard `app.kubernetes.io` labels cannot be overridden.
commonLabels: {}
## @param commonAnnotations Annotations added to all resources and to the pods (template). Annotations set on a resource take precedence.
commonAnnotations: {}

## @param replicas Number of gateway pods (ignored when `autoscaling.enabled` is true)
replicas: 1

## @section Image
image:
  ## @param image.registry Gateway image registry. Set it to your own registry when you mirror the image.
  registry: ghcr.io
  ## @param image.repository Gateway image repository, without the registry
  repository: wearefrank/frank-gateway
  ## @param image.tag Gateway image tag, defaults to the chart `appVersion`
  tag: ""
  ## @param image.digest Gateway image digest, for example `sha256:abc...`. It takes precedence over the tag.
  digest: ""
  ## @param image.pullPolicy Image pull policy
  pullPolicy: IfNotPresent
## @param imagePullSecrets Secrets used to pull the image, same structure as `spec.imagePullSecrets` in a Pod
imagePullSecrets: []

## @section Standalone configuration (apisix.yaml)
## @descriptionStart
## In standalone mode APISIX reads its routes, upstreams, ssls, consumers and so on from `apisix.yaml`.
## The chart adds the mandatory `#END` marker when it is missing from `standalone.apisixYaml`.
## `${{NAME}}` placeholders in the file are resolved by APISIX from environment variables, so secrets
## can be injected with `env` or `envFrom` and do not have to be stored in the file.
## When `existingConfigMap` or `existingSecret` is used, APISIX reloads the file when Kubernetes updates it
## (the pod does not restart). With `apisixYaml` the pod restarts on every change.
## @descriptionEnd
standalone:
  ## @param standalone.apisixYaml Content of `apisix.yaml`, ignored when `existingConfigMap` or `existingSecret` is set
  apisixYaml: |
    routes: []
  ## @param standalone.existingConfigMap Name of an existing ConfigMap that contains the `apisix.yaml` file
  existingConfigMap: ""
  ## @param standalone.existingSecret Name of an existing Secret that contains the `apisix.yaml` file (takes precedence over `existingConfigMap`)
  existingSecret: ""
  ## @param standalone.key Key of the `apisix.yaml` file in the ConfigMap or Secret
  key: apisix.yaml

## @section APISIX configuration (config.yaml)
## @descriptionStart
## `config` is the content of the APISIX `config.yaml`, using the native APISIX names (snake_case).
## See https://apisix.apache.org/docs/apisix/configuration/. It is merged over the APISIX defaults, so only
## the values that differ need to be set. Lists, such as `plugins`, are replaced as a whole.
##
## The chart manages these keys itself and overrides them: `apisix.node_listen`, `apisix.enable_admin`,
## `apisix.enable_control`, `apisix.control`, `apisix.ssl.enable`, `apisix.ssl.listen`, `deployment`
## and `plugin_attr.prometheus` (see `containerPorts`, `control` and `metrics`).
## @descriptionEnd
config:
  apisix:
    ## @param config.apisix.enable_server_tokens Show the APISIX version in the `Server` header (we do not want to leak it)
    enable_server_tokens: false
    ## @param config.apisix.enable_ipv6 Enable the nginx IPv6 resolver
    enable_ipv6: true
    ## @param config.apisix.enable_http2 Enable HTTP/2 on the TLS listener
    enable_http2: true
    ## @param config.apisix.extra_lua_path Extra Lua module search path, used for the plugins baked into the image
    extra_lua_path: /usr/local/apisix/custom-plugins/?.lua
    ## @param config.apisix.router.http How routes are matched: `radixtree_uri`, `radixtree_host_uri` or `radixtree_uri_with_parameter`
    router:
      http: radixtree_host_uri
    ssl:
      ## @param config.apisix.ssl.ssl_protocols Supported TLS versions (space separated)
      ssl_protocols: TLSv1.2 TLSv1.3
      ## @param config.apisix.ssl.ssl_ciphers Supported TLSv1.2 cipher suites. The APISIX default list trips security scanners.
      ssl_ciphers: ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256
      ## @param config.apisix.ssl.ssl_session_tickets Use TLS session tickets (they defeat perfect forward secrecy)
      ssl_session_tickets: false
  nginx_config:
    ## @param config.nginx_config.error_log Location of the error log. Log to stderr, the log directory is a pod local `emptyDir`.
    error_log: /dev/stderr
    ## @param config.nginx_config.error_log_level Error log level: `debug`, `info`, `notice`, `warn`, `error`, `crit`, `alert` or `emerg`
    error_log_level: warn
    ## @extra config.nginx_config.worker_processes Number of nginx workers. Not set by default, which is `auto`: one per CPU core.
    # worker_processes: auto
    ## @param config.nginx_config.worker_shutdown_timeout Time workers get to finish requests on shutdown or reload, after which open connections are closed. Keep it below `terminationGracePeriodSeconds` minus the `preStop` sleep (10s).
    worker_shutdown_timeout: 45s
    http:
      ## @param config.nginx_config.http.enable_access_log Enable the access log
      enable_access_log: true
      ## @param config.nginx_config.http.access_log Location of the access log
      access_log: /dev/stdout
      ## @extra config.nginx_config.http.client_max_body_size Maximum request body size, a number of bytes or a size such as `10m`. Not set by default, which is unlimited (`0`).
      # client_max_body_size: 10m
      ## @skip config.nginx_config.http.custom_lua_shared_dict
      ## @extra config.nginx_config.http.custom_lua_shared_dict Lua shared dictionaries used by the WeAreFrank plugins, name and size
      custom_lua_shared_dict:
        fsc-registration: 1m
        openid-connect-client-cache: 1m
        generic-oauth-client-cache: 1m
        jwt-client-cache: 1m
        merge-config: 1m
    ## @param config.nginx_config.http_configuration_snippet Raw nginx configuration added to the `http` block
    http_configuration_snippet: |
      lua_ssl_protocols TLSv1.2 TLSv1.3;
    ## @param config.nginx_config.http_server_configuration_snippet Raw nginx configuration added to the `server` block
    http_server_configuration_snippet: |
      lua_ssl_verify_depth 4;
    meta:
      ## @skip config.nginx_config.meta.lua_shared_dict
      lua_shared_dict:
        prometheus-metrics: 15m
  ## @param config.plugins Enabled plugins. Custom (WeAreFrank) plugins must be listed here too or APISIX does not load them. [array]
  plugins:
    - real-ip
    - ai
    - client-control
    - proxy-control
    - request-id
    - zipkin
    - ext-plugin-pre-req
    - fault-injection
    - mocking
    - serverless-pre-function
    - cors
    - ip-restriction
    - ua-restriction
    - referer-restriction
    - csrf
    - uri-blocker
    - request-validation
    - chaitin-waf
    - multi-auth
    - openid-connect
    - cas-auth
    - authz-casbin
    - authz-casdoor
    - wolf-rbac
    - ldap-auth
    - hmac-auth
    - basic-auth
    - jwt-auth
    - jwe-decrypt
    - key-auth
    - consumer-restriction
    - forward-auth
    - opa
    - authz-keycloak
    - proxy-cache
    - body-transformer
    - proxy-mirror
    - proxy-rewrite
    - workflow
    - api-breaker
    - limit-conn
    - limit-count
    - limit-req
    - response-extractor
    - gzip
    - server-info
    - traffic-split
    - redirect
    - response-rewrite
    - degraphql
    - kafka-proxy
    - grpc-transcode
    - grpc-web
    - public-api
    - prometheus
    - datadog
    - loki-logger
    - elasticsearch-logger
    - echo
    - loggly
    - http-logger
    - splunk-hec-logging
    - skywalking-logger
    - google-cloud-logging
    - sls-logger
    - tcp-logger
    - kafka-logger
    - rocketmq-logger
