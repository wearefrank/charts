## @section General
## @descriptionStart
## These are all overrides for the `apisix` subchart dependency, so everything must be
## nested under the `apisix:` key (otherwise it never reaches the subchart, see
## apache/apisix-helm-chart's values.yaml). Chart version 2.14.0 no longer has a separate
## dashboard subchart/dependency, so there is no key for that.
##
## Gotcha: the subchart itself also has its own top-level `apisix:` key (a 1-to-1 mirror
## of the APISIX `config.yaml` `apisix:` section, which includes `deployment:` among
## others). To override something in there you need `apisix.apisix.*` from our
## values.yaml — the first `apisix:` is the dependency, the second is their own config
## section.
## @descriptionEnd
apisix:
  ## @section Image
  ## Custom GHCR image for the APISIX container, built with WeAreFrank plugins (SOAP/FSC/OIDC).
  ##
  image:
    ## @param apisix.image.repository APISIX container image repository
    repository: ghcr.io/wearefrank/frank-gateway
    ## @param apisix.image.tag APISIX container image tag (immutable tags are recommended)
    tag: "1.0.0"

  ## @section Deployment mode
  ## Gotcha: the subchart itself also has its own top-level `apisix:` key (a 1-to-1
  ## mirror of the APISIX config.yaml `apisix:` section). To override something in
  ## there you use `apisix.apisix.*` — the first `apisix:` is the dependency, the
  ## second is their own config section.
  ##
  apisix:
    ## @param apisix.apisix.enableServerTokens hides apisix version in header and error pages (we don't want to leak our version to the public)
    enableServerTokens: false
    deployment:
      ## @param apisix.apisix.deployment.mode APISIX deployment mode (we run standalone, without etcd)
      mode: standalone
      role_traditional:
        ## @param apisix.apisix.deployment.role_traditional.config_provider Configuration provider used in standalone mode
        config_provider: yaml
      standalone:
        ## @param apisix.apisix.deployment.standalone.config Inline APISIX routes configuration (YAML string); customers override this with their own routes
        config: |
          routes: []
        # existingConfigMap: "frank-gateway-routes" # alternative: point to an existing ConfigMap instead of inline config
    ## @section ssl settings and ciphers to limit the use of unsecure vyfers
    ## @param apisix.apisix.ssl.enabled Enable TLS/SSL termination in APISIX (we always want this)
    ## @param apisix.apisix.ssl.sslProtocols TLS protocol versions to support (space-separated list, e.g. "TLSv1.2 TLSv1.3")
    ## @param apisix.apisix.ssl.sslCiphers TLS cipher suites to support
    ssl:
        enabled: true
        sslProtocols: "TLSv1.2 TLSv1.3"
        # Smaller list of supported TLSv1.2 ciphers that are still considered secure. The default list will trip security scanners and is not recommended for production use.
        sslCiphers: "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256"
    ## @section Custom plugins
    ## Lua plugins baked into the WeAreFrank image (SOAP/FSC/OIDC/etc.), loaded via the
    ## APISIX `custom-plugins` mechanism rather than upstream's `plugins`/`apisix.plugins`.
    ## Plugin code is baked into the image under `/usr/local/apisix/custom-plugins/apisix/plugins`.
    ##
    ## @param apisix.apisix.customPlugins.enabled Enable custom (WeAreFrank) Lua plugins baked into the image
    ## @param apisix.apisix.customPlugins.luaPath Lua module search path pattern used to locate custom plugin code
    customPlugins:
      enabled: true
      luaPath: "/usr/local/apisix/custom-plugins/?.lua"
      ## @skip apisix.apisix.customPlugins.plugins
      ## @extra apisix.apisix.customPlugins.plugins Custom plugin definitions: each entry has `name` (must match its Lua module name), `attrs` (passed through to the APISIX plugin config), and an optional `configMap` (`name`/`mounts`) to mount plugin config from an existing ConfigMap.
      plugins:
        - name: cert-auth
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: frank-sender
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: generic-oauth-client
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: jwt-client
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: limit-size
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: soap-action-router
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: openid-connect-client
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: fsc
          attrs: {}
          configMap:
            name: ""
            mounts: []

    ## @param apisix.apisix.plugins Enabled APISIX plugin list; custom plugins (see `customPlugins.plugins` above) must also be listed here, or APISIX won't load them
    plugins:                           # plugin list (sorted by priority)
      - real-ip                   # priority: 23000
      #- ai                       # priority: 22900
      - client-control            # priority: 22000
      - proxy-control             # priority: 21990
      - request-id                # priority: 12015
      #- zipkin                   # priority: 12011
      #- skywalking               # priority: 12010
      - opentelemetry             # priority: 12009
      - ext-plugin-pre-req        # priority: 12000
      - fault-injection           # priority: 11000
      - mocking                   # priority: 10900
      - serverless-pre-function   # priority: 10000
      #- batch-requests           # priority: 4010
      - cors                      # priority: 4000
      - ip-restriction            # priority: 3000
      - ua-restriction            # priority: 2999
      - referer-restriction       # priority: 2990
      - csrf                      # priority: 2980
      - uri-blocker               # priority: 2900
      - request-validation        # priority: 2800
      - chaitin-waf               # priority: 2700
      - multi-auth                # priority: 2600
      - openid-connect            # priority: 2599
      - cas-auth                  # priority: 2597
      - authz-casbin              # priority: 2560
      - authz-casdoor             # priority: 2559
      - wolf-rbac                 # priority: 2555
      - ldap-auth                 # priority: 2540
      - hmac-auth                 # priority: 2530
      - basic-auth                # priority: 2520
      - jwt-auth                  # priority: 2510
      - jwe-decrypt               # priority: 2509
      - key-auth                  # priority: 2500
      - consumer-restriction      # priority: 2400
      - forward-auth              # priority: 2002
      - opa                       # priority: 2001
      - authz-keycloak            # priority: 2000
      #- error-log-logger         # priority: 1091
      - proxy-cache               # priority: 1085
      - body-transformer          # priority: 1080
      - proxy-mirror              # priority: 1010
      - proxy-rewrite             # priority: 1008
      - workflow                  # priority: 1006
