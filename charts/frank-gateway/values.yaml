    - ext-plugin-post-resp

## @section Container
## @param containerPorts.http Port of the plain HTTP listener in the container (must be above 1024, the container runs as non-root)
## @param containerPorts.https Port of the HTTPS listener in the container
containerPorts:
  http: 9080
  https: 9443

## @param env Environment variables of the gateway container, same structure as `env` in a container (template). Use it to feed `${{NAME}}` placeholders in `apisix.yaml`.
env: []
## @param envFrom Sources for environment variables, same structure as `envFrom` in a container (template)
envFrom: []
## @param command Override the command of the gateway container. The image's own entrypoint is used when empty.
command: []
## @param args Override the arguments of the gateway container
args: []
## @skip resources
## @extra resources Resource requests and limits of the gateway container, same structure as `resources` in a container. The default requests 200m CPU and 256Mi memory, and limits 1 CPU and 2Gi. Write the quantities as strings, for example `"1"`.
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 2Gi
## @skip livenessProbe
## @extra livenessProbe Liveness probe of the gateway container, same structure as `livenessProbe` in a container. The default is a TCP check of the `http` port, with a delay of 15 seconds.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 6
## @skip readinessProbe
## @extra readinessProbe Readiness probe of the gateway container, same structure as `readinessProbe` in a container. The default is a TCP check of the `http` port, with a delay of 5 seconds.
readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3
## @param startupProbe Startup probe of the gateway container
startupProbe: {}
## @skip lifecycle
## @extra lifecycle Lifecycle hooks of the gateway container. The `preStop` hook waits 10 seconds so endpoints can drain while the gateway keeps serving, then stops nginx gracefully and waits until it has finished the in-flight requests. The image also finishes its in-flight requests on SIGTERM, so the wait is what the hook adds.
lifecycle:
  preStop:
    exec:
      command:
        - sh
        - -c
        - sleep 10; openresty -p /usr/local/apisix -s quit; while kill -0 "$(cat /usr/local/apisix/logs/nginx.pid 2>/dev/null)" 2>/dev/null; do sleep 1; done
## @param volumes Additional volumes of the pod, same structure as `volumes` in a Pod (template)
volumes: []
## @param volumeMounts Additional volume mounts of the gateway container, same structure as `volumeMounts` in a container (template)
volumeMounts: []
## @param initContainers Additional init containers, they run after the chart's own `prepare-conf` init container (template)
initContainers: []
## @param sidecars Additional containers in the pod (template)
sidecars: []

## @section Diagnostic mode
## @descriptionStart
## With a read-only root filesystem you cannot easily debug a container that crashes on start. In diagnostic
## mode the gateway container only runs `sleep infinity`, without probes and without `lifecycle` hooks, so
## you can open a shell in it. The init container still runs, so the `conf` directory is prepared.
## @descriptionEnd
diagnosticMode:
  ## @param diagnosticMode.enabled Enable diagnostic mode
  enabled: false
  ## @param diagnosticMode.command Command to run in diagnostic mode
  command:
    - sleep
  ## @param diagnosticMode.args Arguments of the command in diagnostic mode
  args:
    - infinity

## @section Pod
## @param podAnnotations Annotations added to the pods (template)
podAnnotations: {}
## @param podLabels Labels added to the pods (template)
podLabels: {}
## @skip podSecurityContext
## @extra podSecurityContext Security context of the pod, same structure as `securityContext` in a Pod. The default is the baseline: non-root user 636 and the `RuntimeDefault` seccomp profile.
podSecurityContext:
  fsGroup: 636
  fsGroupChangePolicy: OnRootMismatch
  runAsUser: 636
  runAsGroup: 636
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
## @skip securityContext
## @extra securityContext Security context of the gateway and init containers, same structure as `securityContext` in a container. The default is the baseline: non-root user 636, no privilege escalation, no capabilities and a read-only root filesystem. The chart mounts writable `emptyDir` volumes where APISIX needs to write.
securityContext:
  runAsUser: 636
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
## @param terminationGracePeriodSeconds Time Kubernetes waits for the gateway to stop. It covers the 10 second `preStop` sleep plus `config.nginx_config.worker_shutdown_timeout`, after which Kubernetes kills the container.
terminationGracePeriodSeconds: 60
## @param priorityClassName Priority class of the pods
priorityClassName: ""
## @param nodeSelector Node selector of the pods
nodeSelector: {}
## @param tolerations Tolerations of the pods
tolerations: []
## @param affinity Affinity of the pods (template)
affinity: {}
## @skip topologySpreadConstraints
## @extra topologySpreadConstraints Topology spread constraints of the pods (template). A constraint without a `labelSelector` gets the selector of the gateway pods. The default spreads the pods over the nodes when possible, set it to `[]` to turn that off.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
## @param strategy.type Deployment strategy type: `RollingUpdate` or `Recreate`
## @extra strategy.rollingUpdate Settings of a rolling update, same structure as `spec.strategy.rollingUpdate` in a Deployment. Numbers and percentages such as `25%` are allowed. A missing `maxUnavailable` is 0 and a missing `maxSurge` is 1, so a rolling update starts a new pod before it stops an old one.
strategy:
  type: RollingUpdate

## @section Service account
serviceAccount:
  ## @param serviceAccount.create Create a service account
  create: true
  ## @param serviceAccount.name Name of the service account, generated when empty and `create` is true
  name: ""
  ## @param serviceAccount.annotations Annotations of the service account
  annotations: {}
  ## @param serviceAccount.automountServiceAccountToken Mount the service account token in the pod. The gateway does not talk to the Kubernetes API.
  automountServiceAccountToken: false

## @section Service
## @descriptionStart
## The gateway Service. Set `type: LoadBalancer` to expose the gateway directly, without Ingress or HTTPRoute.
## `ports` has the same structure as `spec.ports` in a Service. A missing `targetPort` is the name of the port,
## which is the name of a container port (`http` and `https`), and a missing `protocol` is `TCP`.
## A list is replaced as a whole when you override it.
## @descriptionEnd
service:
  ## @param service.type Service type: `ClusterIP`, `NodePort` or `LoadBalancer`
  type: ClusterIP
  ## @param service.annotations Service annotations (template)
  annotations: {}
  ## @param service.labels Service labels
  labels: {}
  ## @skip service.ports
  ## @extra service.ports Service ports, same structure as `spec.ports` in a Service. A `targetPort` is a container port name or number. The default maps `http` 80 to the container port `http` and `https` 443 to `https`.
  ports:
    - name: http
      port: 80
    - name: https
      port: 443
  ## @param service.externalTrafficPolicy `Cluster` or `Local`, only used for `NodePort` and `LoadBalancer`. Unset by default.
  externalTrafficPolicy: ""
  ## @param service.loadBalancerClass Load balancer implementation, only used for `LoadBalancer`
  loadBalancerClass: ""
  ## @param service.loadBalancerSourceRanges Client CIDRs allowed to use the load balancer, only used for `LoadBalancer`
  loadBalancerSourceRanges: []
  ## @param service.externalIPs IP addresses outside the cluster on which the Service is also available, same as `spec.externalIPs`
  externalIPs: []
  ## @param service.ipFamilyPolicy `SingleStack`, `PreferDualStack` or `RequireDualStack`, same as `spec.ipFamilyPolicy`. Unset by default.
  ipFamilyPolicy: ""
  ## @param service.ipFamilies IP families of the Service, `IPv4` and or `IPv6`, same as `spec.ipFamilies`
  ipFamilies: []
  ## @param service.internalTrafficPolicy `Cluster` or `Local`, same as `spec.internalTrafficPolicy`. Unset by default.
  internalTrafficPolicy: ""
  ## @param service.sessionAffinity `None` or `ClientIP`, same as `spec.sessionAffinity`. Unset by default.
  sessionAffinity: ""

## @section Ingress
## @descriptionStart
## A `networking.k8s.io/v1` Ingress. `rules` and `tls` have the same structure as in the Ingress spec.
## A path without `backend` gets the gateway Service as backend, on the port named in `defaultBackendPort`.
## For TLS passthrough (client certificates validated by APISIX) use the `https` port and the annotation
## of your ingress controller, for example `ingress.cilium.io/tls-passthrough: "enabled"` for Cilium.
## @descriptionEnd
ingress:
  ## @param ingress.enabled Create an Ingress
  enabled: false
  ## @param ingress.annotations Ingress annotations (template)
  annotations: {}
  ## @param ingress.labels Ingress labels
  labels: {}
  ## @param ingress.ingressClassName Ingress class, same as `spec.ingressClassName`
  ingressClassName: ""
  ## @param ingress.defaultBackendPort Name of the port in `service.ports` used by paths without a `backend`
  defaultBackendPort: https
  ## @skip ingress.rules
  ## @extra ingress.rules Ingress rules, same structure as `spec.rules` in an Ingress (template). A path without `backend` gets the gateway Service as backend.
  rules:
    - host: gateway.local
      http:
        paths:
          - path: /
            pathType: Prefix
  ## @param ingress.tls Ingress TLS settings, same structure as `spec.tls` in an Ingress (template)
  tls: []

## @section Gateway API
## @descriptionStart
## Routes for the Kubernetes Gateway API (`gateway.networking.k8s.io`). The Gateway API CRDs and a Gateway must exist.
## Use an `HTTPRoute` when the Gateway terminates TLS. Use a `TLSRoute` when TLS must pass through to APISIX,
## for example because APISIX validates client certificates (mTLS). A rule without `backendRefs` gets
## the gateway Service as backend.
## @descriptionEnd
httpRoute:
  ## @param httpRoute.enabled Create an HTTPRoute
  enabled: false
  ## @param httpRoute.annotations HTTPRoute annotations (template)
  annotations: {}
  ## @param httpRoute.labels HTTPRoute labels
  labels: {}
  ## @param httpRoute.parentRefs Gateways to attach to, same structure as `spec.parentRefs` (template). Required.
  parentRefs: []
  ## @param httpRoute.hostnames Hostnames to match, same as `spec.hostnames` (template)
  hostnames: []
  ## @param httpRoute.defaultBackendPort Name of the port in `service.ports` used by rules without `backendRefs`
  defaultBackendPort: http
  ## @skip httpRoute.rules
  ## @extra httpRoute.rules Rules, same structure as `spec.rules` in an HTTPRoute. A rule without `backendRefs` gets the gateway Service as backend.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
tlsRoute:
  ## @param tlsRoute.enabled Create a TLSRoute (TLS passthrough)
  enabled: false
  ## @param tlsRoute.apiVersion API version of the TLSRoute, detected from the cluster when empty (`v1`, otherwise `v1alpha2`)
  apiVersion: ""
  ## @param tlsRoute.annotations TLSRoute annotations (template)
  annotations: {}
  ## @param tlsRoute.labels TLSRoute labels
  labels: {}
  ## @param tlsRoute.parentRefs Gateways (listeners with TLS mode `Passthrough`) to attach to, same structure as `spec.parentRefs` (template). Required.
  parentRefs: []
  ## @param tlsRoute.hostnames SNI hostnames to match, same as `spec.hostnames` (template). Required.
  hostnames: []
  ## @param tlsRoute.defaultBackendPort Name of the port in `service.ports` used by rules without `backendRefs`
  defaultBackendPort: https
  ## @skip tlsRoute.rules
  ## @extra tlsRoute.rules Rules, same structure as `spec.rules` in a TLSRoute. A rule without `backendRefs` gets the gateway Service as backend.
  rules:
    - {}

## @section Control API
## @descriptionStart
## The APISIX Control API (health checks, plugin and upstream status), for example for a dashboard.
## It has no authentication, and it can read the route configuration and reload plugins. It is only exposed
## through its own Service and never through Ingress or Gateway API routes. Restrict access to it with
## `networkPolicy.control.from` or a NetworkPolicy of your own.
## @descriptionEnd
control:
  ## @param control.enabled Enable the Control API
  enabled: false
  ## @param control.port Container port of the Control API
  port: 9090
  service:
    ## @param control.service.type Service type of the Control API Service
    type: ClusterIP
    ## @param control.service.port Service port of the Control API
    port: 9090
    ## @param control.service.annotations Annotations of the Control API Service
    annotations: {}
    ## @param control.service.labels Labels of the Control API Service
    labels: {}

## @section Metrics
## @descriptionStart
## Prometheus metrics of the `prometheus` plugin, served on their own port and Service.
## The plugin must be enabled in `config.plugins` and on routes or in a `global_rules` entry in `apisix.yaml`.
## @descriptionEnd
metrics:
  ## @param metrics.enabled Serve Prometheus metrics and create the metrics Service
  enabled: false
  ## @param metrics.port Container and Service port of the metrics endpoint
  port: 9091
  ## @param metrics.path Path of the metrics endpoint
  path: /apisix/prometheus/metrics
  ## @param metrics.service.annotations Annotations of the metrics Service
  service:
    annotations: {}
  serviceMonitor:
    ## @param metrics.serviceMonitor.enabled Create a Prometheus Operator ServiceMonitor
    enabled: false
    ## @param metrics.serviceMonitor.namespace Namespace of the ServiceMonitor, the release namespace when empty
    namespace: ""
    ## @param metrics.serviceMonitor.labels Labels of the ServiceMonitor, for example the label your Prometheus selects on
    labels: {}
    ## @param metrics.serviceMonitor.annotations Annotations of the ServiceMonitor (template)
    annotations: {}
    ## @param metrics.serviceMonitor.jobLabel Label of the Service whose value becomes the `job` label, `spec.jobLabel`. Unset by default.
    jobLabel: ""
    ## @param metrics.serviceMonitor.honorLabels Keep the labels of the scraped metrics when they conflict with the target labels
    honorLabels: false
    ## @param metrics.serviceMonitor.interval Scrape interval
    interval: 30s
    ## @param metrics.serviceMonitor.scrapeTimeout Scrape timeout
    scrapeTimeout: 10s
    ## @param metrics.serviceMonitor.relabelings Relabelings, same structure as in a ServiceMonitor endpoint
    relabelings: []
    ## @param metrics.serviceMonitor.metricRelabelings Metric relabelings, same structure as in a ServiceMonitor endpoint
    metricRelabelings: []

## @section Autoscaling and availability
autoscaling:
  ## @param autoscaling.enabled Create a HorizontalPodAutoscaler
  enabled: false
  ## @param autoscaling.minReplicas Minimum number of replicas
  minReplicas: 2
  ## @param autoscaling.maxReplicas Maximum number of replicas
  maxReplicas: 5
  ## @skip autoscaling.metrics
  ## @extra autoscaling.metrics Metrics, same structure as `spec.metrics` in an `autoscaling/v2` HorizontalPodAutoscaler
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  ## @param autoscaling.behavior Scaling behavior, same structure as `spec.behavior` in an `autoscaling/v2` HorizontalPodAutoscaler
  behavior: {}
podDisruptionBudget:
  ## @param podDisruptionBudget.enabled Create a PodDisruptionBudget
  enabled: false
  ## @extra podDisruptionBudget.minAvailable Minimum available pods, a number or a percentage such as `50%`. Takes precedence over `maxUnavailable`. Not set by default.
  ## @extra podDisruptionBudget.maxUnavailable Maximum unavailable pods, a number or a percentage such as `50%`. Defaults to `1` when `minAvailable` is not set.
  # minAvailable: 1
  # maxUnavailable: 1
  ## @param podDisruptionBudget.unhealthyPodEvictionPolicy Whether unready pods can be evicted: `AlwaysAllow` or `IfHealthyBudget`, empty to leave it unset. Only rendered on Kubernetes 1.27 or newer.
  unhealthyPodEvictionPolicy: AlwaysAllow

## @section Network policy
## @descriptionStart
## An optional NetworkPolicy for the gateway pods. It only restricts ingress, the gateway has to reach its upstreams.
## The gateway ports (`containerPorts.http` and `containerPorts.https`) accept traffic from anywhere, so ingress
## controllers and Gateways keep working. The Control API and metrics ports are only reachable from the
## peers you list in `control.from` and `metrics.from`. Without peers nobody can reach them.
## A peer has the structure of `from` in a NetworkPolicy ingress rule, for example a `podSelector`,
## a `namespaceSelector` or an `ipBlock`.
## @descriptionEnd
networkPolicy:
  ## @param networkPolicy.enabled Create a NetworkPolicy
  enabled: false
  control:
    ## @param networkPolicy.control.from Peers that may reach the Control API port (template). Needs `control.enabled`.
    from: []
  metrics:
    ## @param networkPolicy.metrics.from Peers that may reach the metrics port (template). Needs `metrics.enabled`.
    from: []
  ## @param networkPolicy.extraIngress Additional ingress rules, same structure as `spec.ingress` in a NetworkPolicy (template)
  extraIngress: []

## @section Extra objects
## @param extraObjects Additional Kubernetes objects to deploy with the release. Each item is an object or a string, and is rendered as a template.
extraObjects: []
