      - ext-plugin-post-resp      # priority: -4000

  ## @section etcd
  ## We use standalone/yaml mode and don't talk to etcd at all (internal or external).
  ##
  etcd:
    ## @param apisix.etcd.enabled Enable the bundled etcd subchart
    enabled: false

  ## @param apisix.externalEtcd.user External etcd username, emptied to avoid an unused etcd secret/env var since `etcd.enabled` is false
  externalEtcd:
    user: ""

  ## @section Ingress controller
  ##
  ingress-controller:
    ## @param apisix.ingress-controller.enabled Enable the bundled APISIX ingress-controller subchart
    enabled: false
