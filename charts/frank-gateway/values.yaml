# Let op: dit zijn allemaal overrides voor de `apisix` subchart-dependency, dus
# alles moet genest staan onder de `apisix:` key (anders komt het nooit aan bij
# de subchart, zie apache/apisix-helm-chart values.yaml). Er is in chart-versie
# 2.14.0 geen aparte dashboard-subchart/dependency (meer), dus daar is geen key voor.
#
# Extra addertje: de subchart heeft zelf ook weer een top-level `apisix:` key
# (een 1-op-1 spiegel van de APISIX config.yaml `apisix:`-sectie, met daaronder
# o.a. `deployment:`). Om daar iets in te overriden moet je dus `apisix.apisix.*`
# gebruiken vanuit onze values.yaml — de eerste `apisix:` is de dependency, de
# tweede is hun eigen config-sectie.
apisix:
  ## @section Image
  ## Custom GHCR image for the APISIX container, built with WeAreFrank plugins (SOAP/FSC/OIDC).
  ##
  image:
    ## @param apisix.image.repository APISIX container image repository
    repository: ghcr.io/wearefrank/frank-api-gateway
    ## @param apisix.image.tag APISIX container image tag (immutable tags are recommended)
    tag: "3.16.0"

  ## @section Deployment mode
  ## Extra addertje: de subchart heeft zelf ook weer een top-level `apisix:` key
  ## (1-op-1 spiegel van de APISIX config.yaml `apisix:`-sectie). Om daar iets in
  ## te overriden gebruik je dus `apisix.apisix.*` — de eerste `apisix:` is de
  ## dependency, de tweede is hun eigen config-sectie.
  ##
  apisix:
    deployment:
      ## @param apisix.apisix.deployment.mode APISIX deployment mode (we run standalone, without etcd)
      mode: standalone
      role_traditional:
        ## @param apisix.apisix.deployment.role_traditional.config_provider Configuration provider used in standalone mode
        config_provider: yaml
      standalone:
        ## @param apisix.apisix.deployment.standalone.config Inline APISIX routes configuration (YAML string); customers override this with their own routes
        config: |
          routes: []
        # existingConfigMap: "frank-gateway-routes" # alternative: point to an existing ConfigMap instead of inline config

    ## @section Custom plugins
    ## Lua plugins baked into the WeAreFrank image (SOAP/FSC/OIDC/etc.), loaded via the
    ## APISIX `custom-plugins` mechanism rather than upstream's `plugins`/`apisix.plugins`.
    ##
    ## @param apisix.apisix.customPlugins.enabled Enable custom (WeAreFrank) Lua plugins baked into the image
    ## @param apisix.apisix.customPlugins.luaPath Lua module search path pattern used to locate custom plugin code
    customPlugins:
      enabled: true
      # Plugin code is baked into the Frank Gateway image under:
      # /usr/local/apisix/custom-plugins/apisix/plugins
      luaPath: "/usr/local/apisix/custom-plugins/?.lua"
      ## @skip apisix.apisix.customPlugins.plugins
      # Custom plugin definitions: each entry has `name` (must match its Lua module name),
      # `attrs` (passed through to the APISIX plugin config), and an optional `configMap`
      # (`name`/`mounts`) to mount plugin config from an existing ConfigMap.
      plugins:
        - name: cert-auth
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: frank-sender
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: generic-oauth-client
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: jwt-client
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: limit-size
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: soap-action-router
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: openid-connect-client
          attrs: {}
          configMap:
            name: ""
            mounts: []
        - name: fsc
          attrs: {}
          configMap:
            name: ""
            mounts: []

    ## @param apisix.apisix.plugins Enabled APISIX plugin list; custom plugins (see `customPlugins.plugins` above) must also be listed here, or APISIX won't load them
    # Custom plugins currently are required to be listed here as well

    plugins:                           # plugin list (sorted by priority)
      - real-ip                   # priority: 23000
      #- ai                       # priority: 22900
      - client-control            # priority: 22000
      - proxy-control             # priority: 21990
      - request-id                # priority: 12015
      #- zipkin                   # priority: 12011
      #- skywalking               # priority: 12010
      - opentelemetry             # priority: 12009
      - ext-plugin-pre-req        # priority: 12000
      - fault-injection           # priority: 11000
      - mocking                   # priority: 10900
      - serverless-pre-function   # priority: 10000
      #- batch-requests           # priority: 4010
      - cors                      # priority: 4000
      - ip-restriction            # priority: 3000
      - ua-restriction            # priority: 2999
      - referer-restriction       # priority: 2990
      - csrf                      # priority: 2980
      - uri-blocker               # priority: 2900
      - request-validation        # priority: 2800
      - chaitin-waf               # priority: 2700
      - multi-auth                # priority: 2600
      - openid-connect            # priority: 2599
      - cas-auth                  # priority: 2597
      - authz-casbin              # priority: 2560
      - authz-casdoor             # priority: 2559
      - wolf-rbac                 # priority: 2555
      - ldap-auth                 # priority: 2540
      - hmac-auth                 # priority: 2530
      - basic-auth                # priority: 2520
      - jwt-auth                  # priority: 2510
      - jwe-decrypt               # priority: 2509
      - key-auth                  # priority: 2500
      - consumer-restriction      # priority: 2400
      - forward-auth              # priority: 2002
      - opa                       # priority: 2001
      - authz-keycloak            # priority: 2000
      #- error-log-logger         # priority: 1091
      - proxy-cache               # priority: 1085
      - body-transformer          # priority: 1080
      - proxy-mirror              # priority: 1010
      - proxy-rewrite             # priority: 1008
      - workflow                  # priority: 1006
      - api-breaker               # priority: 1005
      - limit-conn                # priority: 1003
      - limit-count               # priority: 1002
      - limit-req                 # priority: 1001
      #- node-status              # priority: 1000
      - response-extractor
      #- brotli                   # priority: 996
      - gzip                      # priority: 995
      - server-info               # priority: 990
      - traffic-split             # priority: 966
      - redirect                  # priority: 900
      - response-rewrite          # priority: 899
      - degraphql                 # priority: 509
      #- kafka-proxy              # priority: 508
      #- dubbo-proxy              # priority: 507
      - grpc-transcode            # priority: 506
      - grpc-web                  # priority: 505
      - public-api                # priority: 501
      - prometheus                # priority: 500
      - datadog                   # priority: 495
      - loki-logger               # priority: 414
      - elasticsearch-logger      # priority: 413
      - echo                      # priority: 412
      - loggly                    # priority: 411
      - http-logger               # priority: 410
      - splunk-hec-logging        # priority: 409
      - skywalking-logger         # priority: 408
      - google-cloud-logging      # priority: 407
      - sls-logger                # priority: 406
      - tcp-logger                # priority: 405
      - kafka-logger              # priority: 403
      - rocketmq-logger           # priority: 402
      - syslog                    # priority: 401
      - udp-logger                # priority: 400
      - file-logger               # priority: 399
      - clickhouse-logger         # priority: 398
      #- tencent-cloud-cls        # priority: 397
      - inspect                   # priority: 200
      #- log-rotate               # priority: 100
      # <- recommend to use priority (0, 100) for your custom plugins
      - example-plugin            # priority: 0
      - cert-auth                 # priority 100
      - frank-sender
      - generic-oauth-client
      - jwt-client
