name: Check for APISIX Helm chart updates

on:
  schedule:
    # Every Monday 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts/frank-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: "v3.21.3"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Add apisix helm repo (with fallback)
        run: |
          set -euo pipefail
          PRIMARY="https://apache.github.io/apisix-helm-chart"
          FALLBACK="https://charts.apiseven.com"

          if helm repo add apisix "$PRIMARY" --force-update && helm repo update apisix; then
            echo "Using primary repo: $PRIMARY"
          else
            echo "Primary repo unreachable, falling back to $FALLBACK"
            helm repo add apisix "$FALLBACK" --force-update
            helm repo update apisix
          fi

      - name: Determine current and latest version
        id: versions
        run: |
          set -euo pipefail
          CURRENT=$(yq '.dependencies[] | select(.name == "apisix") | .version' Chart.yaml)
          LATEST=$(helm search repo apisix/apisix --versions -o json | yq '.[0].version' -p json)

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          echo "Current pinned chart version: $CURRENT"
          echo "Latest available chart version: $LATEST"

      - name: Update Chart.yaml if there is a newer version
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        run: |
          set -euo pipefail
          LATEST="${{ steps.versions.outputs.latest }}"

          yq -i '(.dependencies[] | select(.name == "apisix") | .version) = strenv(LATEST)' Chart.yaml
          helm dependency update .

      - name: Sanity check with helm template
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        run: |
          helm template frank-gateway . --debug > /dev/null

      - name: Open pull request
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump apisix helm chart dependency to ${{ steps.versions.outputs.latest }}"
          title: "chore: bump apisix chart dependency ${{ steps.versions.outputs.current }} -> ${{ steps.versions.outputs.latest }}"
          body: |
            Automatic update of the `apisix` Helm chart dependency.

            - Current version: `${{ steps.versions.outputs.current }}`
            - New version: `${{ steps.versions.outputs.latest }}`

            Generated by the `check-apisix-update` workflow.
            Before merging, check the release notes of [apache/apisix-helm-chart](https://github.com/apache/apisix-helm-chart/releases)
            and verify that our own `values.yaml` overrides still apply (e.g. standalone config keys,
            image defaults, etcd toggle).
          branch: chore/bump-apisix-chart
          delete-branch: true
          labels: |
            dependencies
            helm
